name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: my-app/.nvmrc
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: my-app/.nvmrc
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc` does not run Next's own route-type checks (for example the signature of route handlers), so build too.
      # Placeholder values only: nothing is contacted at build time.
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  migrations:
    name: Database migrations (PGlite model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app/supabase/tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: my-app/.nvmrc
          cache: npm
          cache-dependency-path: my-app/supabase/tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Applies supabase/migrations/20261015_* to an in-process PostgreSQL model of the production schema and asserts
      # the result (see my-app/supabase/tests/README.md). It is a model, not the real database.
      - name: Migration checks
        run: npm test

  migrate-runner:
    name: Migration runner (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials of a CI-only container that is destroyed with the job; not a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: my-app/.nvmrc

      # Replays the whole chain (baseline files included) on a model of the production schema with the same runner that
      # production uses. This is what validates a new migration file in every pull request. It is a model, not production:
      # see docs/MIGRATIONS.md.
      - name: Load the model schema (and a stand-in for the storage schema)
        run: |
          psql --version
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/live-schema.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/migrate/ci-storage-stub.sql

      - name: Create the tracking table
        run: node supabase/migrate/migrate.mjs init

      - name: Plan
        run: node supabase/migrate/migrate.mjs plan --replay-baseline

      - name: Apply the whole chain
        run: node supabase/migrate/migrate.mjs apply --replay-baseline

      - name: Nothing may be pending afterwards (idempotency of the bookkeeping)
        run: |
          out="$(node supabase/migrate/migrate.mjs plan)"
          echo "$out"
          if [ "$out" != "Nothing pending." ]; then
            echo "::error::migrations are still pending after a full apply"
            exit 1
          fi

      - name: Status
        run: node supabase/migrate/migrate.mjs status

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: my-app/.nvmrc
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in production dependencies unless they are listed (with a reason and a
      # review-by date) in my-app/audit-allowlist.json. See my-app/scripts/audit-check.mjs.
      - name: Dependency audit gate (production dependencies)
        run: node scripts/audit-check.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: early commits once contained credentials

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for organization-owned repositories; harmless otherwise.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
